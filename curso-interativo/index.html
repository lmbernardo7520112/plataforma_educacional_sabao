<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Curso Interativo EcoSabon — Ciência, Sabão e Sustentabilidade. Aprenda saponificação a frio com rigor científico e gamificação.">
  <meta name="theme-color" content="#0a0f1a">
  <title>EcoSabon — Curso Interativo de Saponificação</title>
  <link rel="stylesheet" href="./src/presentation/styles/design-tokens.css">
  <link rel="stylesheet" href="./src/presentation/styles/layout.css">
  <link rel="stylesheet" href="./src/presentation/styles/components.css">
  <link rel="stylesheet" href="./src/presentation/styles/animations.css">
  <style>
    /* Locked lesson overlay */
    .lesson-section.locked {
      opacity: 0.4;
      pointer-events: none;
      position: relative;
    }
    .lesson-lock {
      text-align: center;
      padding: var(--space-4);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-lg);
      color: var(--color-danger);
      font-weight: 600;
      margin-bottom: var(--space-4);
    }
    .lesson-section.complete {
      border-left: 3px solid var(--color-success);
      padding-left: var(--space-4);
    }
    /* Sorting pool */
    .sorting-pool {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      background: var(--color-surface-2);
      margin-bottom: var(--space-4);
      min-height: 50px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
