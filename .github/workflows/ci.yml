name: EcoSabon CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  Quality-Assurance:
    runs-on: ubuntu-latest
    name: 🛡️ Code Quality Check (DevOps)

    steps:
    - name: 📥 Clonar Repositório na Nuvem
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Motor Node.js (v20 LTS)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Instalar Dependências do Monorepo (Blindado CI)
      run: npm ci --legacy-peer-deps

    - name: 🏗️ Compilar Camada 'Shared' (SaponificationEngine)
      run: npm run build:shared

    - name: 🔍 Acionar Fiscal de Linting Global
      run: npm run lint
